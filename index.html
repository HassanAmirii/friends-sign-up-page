<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/asset/icons/favicon.svg" />
    <title>sign up | Friends™</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div class="div-container">
      <!-- login illustration section -->
      <div class="login-img">
        <h1>Friends&trade;</h1>

        <img
          src="/asset/images/Sign up-cuate.png"
          alt=""
          width="500"
          height="500"
        />

        <p class="text-bottom" style="text-align: center">
          Sign up today to get exciting offers..!
        </p>
      </div>

      <!-- form section  -->
      <div class="form-section">
        <h1>Get started</h1>
        <form class="grid-form">
          <div class="form-div">
            <label for="first-name">First Name</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              required
              placeholder="Enter your first name"
            />
          </div>

          <div class="form-div">
            <label for="last-name">Last Name</label>
            <input
              type="text"
              id="last-name"
              name="last-name"
              required
              placeholder="Enter your last name"
            />
          </div>

          <div class="form-div">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="example@domain.com"
            />
          </div>

          <div class="form-div">
            <label for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              placeholder="e.g. 08012345678"
            />
          </div>

          <div class="form-div">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Create a password"
            />
          </div>

          <div class="form-div">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              placeholder="Repeat your password"
            />
          </div>

          <div class="form-div-button">
            <button type="submit">Create Account</button>
            <p>
              Already have an account..?
              <span class="--color-orange"> Log in</span>
            </p>
          </div>
        </form>

        <!-- Full width submit button -->
      </div>
    </div>
  </body>
</html>
